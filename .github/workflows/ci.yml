name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers
          xcodebuild -list -project wedge.xcodeproj

      - name: swift-format check
        run: |
          set -o pipefail
          xcrun swift-format --version
          # Format in place first, so a failure prints the exact patch to apply (git apply) in this log.
          xcrun swift-format format -i -r wedge wedgeTests wedgeUITests
          git diff --exit-code || { echo "::error::swift-format changed files; apply the patch printed above"; exit 1; }
          xcrun swift-format lint -r --strict wedge wedgeTests wedgeUITests 2>&1 | tee lint.log

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project wedge.xcodeproj -scheme wedge -destination 'platform=macOS' \
            -only-testing:wedgeTests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions

      # UI tests cost 10x Mac minutes on a private repo: run them on manual dispatch or when the
      # head commit message contains [ui-tests].
      - name: UI tests
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ui-tests]')
        run: |
          set -o pipefail
          xcodebuild test \
            -project wedge.xcodeproj -scheme wedge -destination 'platform=macOS' \
            -only-testing:wedgeUITests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee xcodebuild-ui.log | xcbeautify --renderer github-actions

      - name: Report failures as annotations
        if: failure()
        run: |
          touch lint.log xcodebuild.log xcodebuild-ui.log
          cat lint.log xcodebuild.log xcodebuild-ui.log \
            | grep -E "error:|\*\* (BUILD|TEST) FAILED|Expectation failed|Issue recorded|failed \(" \
            | head -45 \
            | while IFS= read -r line; do echo "::error::${line:0:900}"; done
