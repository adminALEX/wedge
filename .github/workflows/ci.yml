name: Diag
on: push
permissions:
  contents: write
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
      - name: UI tests
        continue-on-error: true
        run: |
          xcodebuild test \
            -project wedge.xcodeproj -scheme wedge -destination 'platform=macOS' \
            -only-testing:wedgeUITests/WedgeUITests/testAddEditReorderDoneUndo \
            -resultBundlePath ui.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            > xcodebuild-ui.log 2>&1
      - name: Push diagnostics
        if: always()
        run: |
          mkdir -p diag
          cp xcodebuild-ui.log diag/ || true
          xcrun xcresulttool export attachments --path ui.xcresult --output-path diag/attachments || true
          ls -la diag diag/attachments || true
          git config user.name ci && git config user.email ci@example.invalid
          git checkout -b "ci/diag-out-${GITHUB_SHA::7}"
          git add -f diag && git commit -qm "diag" && git push -q origin HEAD
